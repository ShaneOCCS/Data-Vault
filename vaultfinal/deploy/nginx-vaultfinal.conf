# /etc/nginx/conf.d/vaultfinal.conf (Amazon Linux 2023) — reverse proxy
# terminating TLS in
# front of the app, which only ever listens on 127.0.0.1:8080. certbot
# rewrites this file to add the listen 443 ssl / certificate directives the
# first time you run `certbot --nginx`; the server_name and proxy_pass
# blocks below are what you write by hand first.

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # The app trusts this header for rate-limiting and audit-logging
        # the caller's real IP (see internal/handlers/handlers.go's
        # clientIP and internal/ratelimit's sourceIP) — safe only because
        # nginx is the sole thing that can ever reach the app's port.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
